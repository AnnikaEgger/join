<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join Summary</title>
    <link rel="icon" href="../assets/icons/join-logo-white.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../styles/variables.css" />
    <link rel="stylesheet" href="../styles/standard.css" />
    <link rel="stylesheet" href="../styles/fonts.css" />
    <link rel="stylesheet" href="../styles/assets.css" />
    <link rel="stylesheet" href="../styles/templates.css" />
    <link rel="stylesheet" href="../styles/summary.css" />
</head>
<body>

    <section class="sidebar">
        <div class="sidebar-logo">
            <img src="/assets/icons/join-logo-white.svg" alt="Join Logo" />
        </div>

        <nav class="sidebar-nav">
            <ul class="nav-list">
                <li>
                    <a href="summary.html" class="nav-link active">
                        <img class="nav-icon" src="/assets/icons/summary-icon.svg" alt="" />
                        <span>Summary</span>
                    </a>
                </li>
                <li>
                    <a href="add-task.html" class="nav-link">
                        <img class="nav-icon" src="/assets/icons/add-task-icon.svg" alt="" />
                        <span>Add Task</span>
                    </a>
                </li>
                <li>
                    <a href="board.html" class="nav-link">
                        <img class="nav-icon" src="/assets/icons/board-icon.svg" alt="" />
                        <span>Board</span>
                    </a>
                </li>
                <li>
                    <a href="contacts.html" class="nav-link">
                        <img class="nav-icon" src="/assets/icons/contacts-icon.svg" alt="" />
                        <span>Contacts</span>
                    </a>
                </li>
            </ul>
        </nav>

        <div class="sidebar-footer">
            <a href="privacy.html" class="footer-link">Privacy Policy</a>
            <a href="legal notice.html" class="footer-link">Legal notice</a>
        </div>
    </section>

    <header class="header">
        <h1 class="header-title">Kanban Project Management Tool</h1>

        <div class="header-actions">
            <a href="help.html" class="nav-link">
                <img class="nav-icon" src="/assets/icons/help-logo.svg" alt="" />
            </a>
            <div class="header-avatar" id="header-avatar">SM</div>
        </div>
    </header>

    <main class="main-content">
        <section class="summary-page">

            <div class="summary-title">
                <h1>Join 360</h1>
                <div class="title-divider"></div>
                <p>Key Metrics at a Glance</p>
            </div>

            <div class="summary-body">

                <div class="summary-cards">

                    <div class="cards-row cards-row-top">
                        <a href="board.html" class="metric-card metric-card-icon">
                            <div class="card-icon-circle">
                                <svg viewBox="0 0 24 24" width="24" height="24">
                                    <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34a.996.996 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" fill="white"/>
                                </svg>
                            </div>
                            <div class="card-info">
                                <span class="card-count" id="count-todo">0</span>
                                <span class="card-label">To-do</span>
                            </div>
                        </a>

                        <a href="board.html" class="metric-card metric-card-icon">
                            <div class="card-icon-circle">
                                <svg viewBox="0 0 24 24" width="24" height="24">
                                    <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z" fill="white"/>
                                </svg>
                            </div>
                            <div class="card-info">
                                <span class="card-count" id="count-done">0</span>
                                <span class="card-label">Done</span>
                            </div>
                        </a>
                    </div>

                    <a href="board.html" class="metric-card metric-card-wide">
                        <div class="card-urgent-side">
                            <div class="card-icon-circle card-icon-urgent">
                                <svg viewBox="0 0 24 24" width="28" height="28">
                                    <path d="M12 4l-8 8h5v8h6v-8h5z" fill="white"/>
                                </svg>
                            </div>
                            <div class="card-info">
                                <span class="card-count" id="count-urgent">0</span>
                                <span class="card-label">Urgent</span>
                            </div>
                        </div>
                        <div class="card-divider"></div>
                        <div class="card-deadline">
                            <span class="deadline-date" id="deadline-date">No deadline</span>
                            <span class="deadline-label">Upcoming Deadline</span>
                        </div>
                    </a>

                    <div class="cards-row cards-row-bottom">
                        <a href="board.html" class="metric-card metric-card-bottom">
                            <span class="card-count" id="count-board">0</span>
                            <span class="card-label">Tasks in Board</span>
                        </a>

                        <a href="board.html" class="metric-card metric-card-bottom">
                            <span class="card-count" id="count-progress">0</span>
                            <span class="card-label">Tasks In Progress</span>
                        </a>

                        <a href="board.html" class="metric-card metric-card-bottom">
                            <span class="card-count" id="count-feedback">0</span>
                            <span class="card-label">Awaiting Feedback</span>
                        </a>
                    </div>

                </div>

                <aside class="summary-greeting">
                    <h2 id="greeting-text">Good morning,</h2>
                    <p id="greeting-name">Guest</p>
                </aside>

            </div>

        </section>
    </main>

</body>
</html>
