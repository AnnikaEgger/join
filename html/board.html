<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join</title>
    <link rel="icon" href="../assets/icons/join-logo-white.svg" type="image/svg+xml">
    <link rel="stylesheet" type="text/css" href="../styles/board.css">
    <link rel="stylesheet" type="text/css" href="../style.css">
    <link rel="stylesheet" type="text/css" href="../styles/standard.css">
    <link rel="stylesheet" type="text/css" href="../styles/variables.css">
    <link rel="stylesheet" type="text/css" href="../styles/templates.css">
    <link rel="stylesheet" type="text/css" href="../styles/fonts.css">
    <link rel="stylesheet" type="text/css" href="../styles/assets.css">
    <!-- <link rel="stylesheet" href="../styles/add-task.css"> -->
    <script src="../scripts/templates.js"></script>
    <script src="../scripts/board.js"></script>
    <script src="../scripts/add-task.js"></script>
    <script src="../scripts/header.js" defer></script>
</head>

<body onload="loadTasks()">
    <!-- SIDEBAR  -->
    <section class="sidebar">
        <div class="sidebar-logo">
            <img src="/assets/icons/join-logo-white.svg" alt="Join Logo" />
        </div>

        <nav class="sidebar-nav">
            <ul class="nav-list">
                <li>
                    <a href="summary.html" class="nav-link">
                        <img class="nav-icon" src="/assets/icons/summary-icon.svg" alt="" />
                        <span>Summary</span>
                    </a>
                </li>
                <li>
                    <a href="add-task.html" class="nav-link">
                        <img class="nav-icon" src="/assets/icons/add-task-icon.svg" alt="" />
                        <span>Add Task</span>
                    </a>
                </li>
                <li>
                    <a href="board.html" class="nav-link active">
                        <img class="nav-icon" src="/assets/icons/board-icon.svg" alt="" />
                        <span>Board</span>
                    </a>
                </li>
                <li>
                    <a href="contacts.html" class="nav-link">
                        <img class="nav-icon" src="/assets/icons/contacts-icon.svg" alt="" />
                        <span>Contacts</span>
                    </a>
                </li>
            </ul>
        </nav>

        <div class="sidebar-footer">
            <a href="privacy-policy.html" class="footer-link">Privacy Policy</a>
            <a href="legal-notice.html" class="footer-link">Legal notice</a>
        </div>
    </section>

    <!--  HEADER  -->
    <header class="header">
        <a href="summary.html" class="header-logo-mobile">
            <img src="../assets/icons/join-logo-blue.svg" alt="Join Logo" />
        </a>

        <h2 class="header-title">Kanban Project Management Tool</h2>

        <div class="header-actions">
            <a href="help.html" class="nav-link header-help-link">
                <img class="nav-icon" src="../assets/icons/help-logo.svg" alt="" />
            </a>

            <div class="header-user-area">
                <div class="header-avatar" id="header-avatar" onclick="toggleDropdown()"></div>

                <div id="dropdown" class="dropdown-content d-none">
                    <a href="help.html" class="dropdown-help-link">Help</a>
                    <a href="legal-notice.html">Legal Notice</a>
                    <a href="privacy-policy.html">Privacy Policy</a>
                    <a onclick="logout()">Log out</a>
                </div>
            </div>
        </div>
    </header>

    <main class="main-content">
        <section class="board-header">
            <h1 class="head-text">Board</h1>
            <div class="search-and-add-section">
                <form class="form" action="onSubmit">
                    <input onkeyup="filterTasks()" aria-label="Search tasks" id="search-input" class="input-field"
                        required type="text" placeholder="Find Task">
                    <hr>
                    <button onsubmit="filterTasks()" aria-label="Submit search" class="search-btn" type="submit">
                        <img class="search-btn-img" src="../assets/icons/search.svg" alt="search icon">
                    </button>
                </form>
                <button class="add-btn" aria-label="Add task" onclick="openAddTaskDialog()">
                    <span>Add task</span>
                    <img src="../assets/icons/white_plus_button.svg" alt="white plus icon">
                </button>
            </div>
        </section>
        <div id="search-message" class="search-message"></div>
        <section class="board-section">
            <div class="task-titles">
                <div class="task-lanes">
                    <div class="task-title">
                        <h2>To do</h2>
                        <img class="add-task-btn" onclick="openAddTaskDialog()" tabindex="0" aria-label="Add task button" role="button"
                            src="../assets/icons/plus_button.svg" alt="plus button">
                    </div>
                    <div id="to do" class="card-container" ondrop="moveTo('to do'); removeHighlight('to do')"
                        ondragleave="removeHighlight('to do')" ondragover="allowDrop(event); highlight('to do')">
                        <!-- <div class="empty-card-container">
                            <p>No tasks To do</p>
                        </div> -->
                    </div>
                </div>
                <div class="task-lanes">
                    <div class="task-title">
                        <h2>in progress</h2>
                        <img class="add-task-btn" onclick="openAddTaskDialog()" tabindex="0" aria-label="Add task button" role="button"
                            src="../assets/icons/plus_button.svg" alt="plus button">
                    </div>
                    <div id="in progress" class="card-container"
                        ondrop="moveTo('in progress'); removeHighlight('in progress')"
                        ondragleave="removeHighlight('in progress')"
                        ondragover="allowDrop(event); highlight('in progress')">
                        <!-- <div draggable="true" class="card">
                            <span class="category-field">User Story</span>
                            <h3 class="card-text">TestCard</h3>
                            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Voluptas, voluptate.</p>
                            <div class="progress-container">
                                <div class="progress-bar">
                                    <div class="progress-bar-fill" style="width: 50%;"></div>
                                </div>
                                <label class="progress-label" for="progressBar">1/2 Subtasks</label>
                            </div>
                            <div class="card-footer">
                                <div class="badge-container">
                                    <span class="profile-badge">LW</span>
                                    <span class="profile-badge-2">AE</span>
                                    <span class="profile-badge-3">CN</span>
                                </div>
                                <img src="../assets/icons/low-prio-icon.svg" alt="low priority icon">
                            </div>
                        </div> -->
                    </div>
                </div>
                <div class="task-lanes">
                    <div class="task-title">
                        <h2>Await feedback</h2>
                        <img class="add-task-btn" onclick="openAddTaskDialog()" tabindex="0" aria-label="Add task button" role="button"
                            src="../assets/icons/plus_button.svg" alt="plus button">
                    </div>
                    <div id="await feedback" class="card-container"
                        ondrop="moveTo('await feedback'); removeHighlight('await feedback')"
                        ondragleave="removeHighlight('await feedback')"
                        ondragover="allowDrop(event); highlight('await feedback')">
                    </div>
                </div>
                <div class="task-lanes">
                    <div class="task-title">
                        <h2>Done</h2>
                        <img class="add-task-btn" onclick="openAddTaskDialog()" tabindex="0" aria-label="Add task button" role="button"
                            src="../assets/icons/plus_button.svg" alt="plus button">
                    </div>
                    <div id="done" class="card-container" ondrop="moveTo('done'); removeHighlight('done')"
                        ondragleave="removeHighlight('done')" ondragover="allowDrop(event); highlight('done')">
                    </div>
                </div>
            </div>
        </section>
    </main>
    <dialog onclick="closeAddTaskDialog()" id="addTaskDialog" class="add-task-dialog">
        <div onclick="event.stopPropagation()">
            <h2 class="dialog-title">Add Task</h2>
            <form class="add-task-wrapper">
                <div class="add-task-inner-wrapper">
                    <div class="add-task-container">
                        <label id="task-title">Title<span class="red">*</span></label>
                        <input class="input-window" type="text" id="task-title" placeholder="Enter a title" required />
                        <label id="task-description">Description</label>
                        <textarea id="task-description" placeholder="Enter a description"></textarea>
                        <label id="task-due-date">Due Date<span class="red">*</span></label>
                        <input class="task-date-input input-window" lang="en-GB" type="date" id="task-due-date"
                            placeholder="dd/mm/yyyy" required />
                    </div>

                    <div class="seperation-line"></div>

                    <div class="add-task-container">
                        <label id="task-priority">Priority</label>
                        <div id="task-priority" class="add-task-btn-container">
                            <button type="button" onclick="setPriority('urgent')" id="urgent-prio-btn" class="prio-btn">
                                Urgent

                                    fill="none" xmlns="http://www.w3.org/2000/svg">

                                        fill="#FF3D00" />
                                    <path
                                        d="M18.9043 8.76057C18.6696 8.76097 18.4411 8.68612 18.2522 8.54702L10.0002 2.46386L1.7481 8.54702C1.51412 8.71983 1.22104 8.79269 0.93331 8.74956C0.645583 8.70643 0.386785 8.55086 0.213849 8.31706C0.0409137 8.08326 -0.0319941 7.79039 0.011165 7.50288C0.054324 7.21536 0.210015 6.95676 0.443986 6.78395L9.3481 0.213471C9.5368 0.0738799 9.76537 -0.00146484 10.0002 -0.00146484C10.2349 -0.00146484 10.4635 0.0738799 10.6522 0.213471L19.5563 6.78395C19.7422 6.92087 19.8801 7.11298 19.9503 7.33286C20.0204 7.55274 20.0193 7.78914 19.947 8.00832C19.8746 8.22751 19.7349 8.41826 19.5476 8.55335C19.3604 8.68844 19.1352 8.76096 18.9043 8.76057Z"
                                        fill="#FF3D00" />
                                </svg></button><button type="button" onclick="setPriority('medium')"
                                id="medium-prio-btn" class="prio-btn">
                                Medium<svg id="medium-prio-svg" class="prio-svg" width="20" height="8"
                                    viewBox="0 0 20 8" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path
                                        d="M18.9041 7.45086H1.09589C0.805242 7.45086 0.526498 7.33456 0.320979 7.12755C0.11546 6.92054 0 6.63977 0 6.34701C0 6.05425 0.11546 5.77349 0.320979 5.56647C0.526498 5.35946 0.805242 5.24316 1.09589 5.24316H18.9041C19.1948 5.24316 19.4735 5.35946 19.679 5.56647C19.8845 5.77349 20 6.05425 20 6.34701C20 6.63977 19.8845 6.92054 19.679 7.12755C19.4735 7.33456 19.1948 7.45086 18.9041 7.45086Z"

                                </svg></button><button type="button" onclick="setPriority('low')" id="low-prio-btn"

                                    fill="none" xmlns="http://www.w3.org/2000/svg">

                                    <path
                                        d="M10 14.5093C9.7654 14.5097 9.53687 14.4349 9.34802 14.2958L0.444913 7.72606C0.210967 7.55327 0.0552944 7.29469 0.0121402 7.00721C-0.031014 6.71973 0.0418855 6.42689 0.214802 6.19312C0.387718 5.95935 0.646486 5.80379 0.934181 5.76067C1.22188 5.71754 1.51493 5.79039 1.74888 5.96318L10 12.0457L18.2511 5.96318C18.4851 5.79039 18.7781 5.71754 19.0658 5.76067C19.3535 5.80379 19.6123 5.95935 19.7852 6.19312C19.9581 6.42689 20.031 6.71973 19.9879 7.00721C19.9447 7.29469 19.789 7.55327 19.5551 7.72606L10.652 14.2958C10.4631 14.4349 10.2346 14.5097 10 14.5093Z"

                                </svg>
                            </button>
                        </div>
                        <label id="contacts">Assigned to</label>
                        <select class="task-form-select" name="" id="contacts">
                            <option value="" disabled selected>
                                Select contacts to assign
                            </option>
                            <option value="">Option 1</option>
                            <option value="">Option 2</option>
                        </select>
                        <label id="task-category">Category<span class="red">*</span></label>
                        <select class="task-form-select" name="" id="task-category" required>
                            <option value="" disabled selected>Select task category</option>
                            <option value="">Option 1</option>
                            <option value="">Option 2</option>
                        </select>
                        <label id="subtask">Subtasks</label>
                        <input class="input-window" type="text" id="subtask" placeholder="Add new subtask" />
                    </div>
                </div>

                <section class="add-task-bottom-section">
                    <p><span class="red">*</span>this field is required</p>
                    <div class="add-task-bottom-btns-container">
                        <button type="reset" id="clear-task-btn" onclick="toggleBtnColor('clear-task-btn')"
                            class="button add-task-bottom-btn button-white">
                            Clear
                            <svg id="clear-task-btn-svg" width="13" height="13" viewBox="0 0 13 13" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path
                                    d="M6.243 6.243L11.486 11.486M1 11.486L6.243 6.243L1 11.486ZM11.486 1L6.242 6.243L11.486 1ZM6.242 6.243L1 1L6.242 6.243Z"
                                    stroke="#2A3647" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                        </button>
                        <button type="submit" id="create-task-btn" onclick="toggleBtnColor('create-task-btn')"
                            class="button add-task-bottom-btn button-white">
                            Create Task
                            <svg id="create-task-btn-svg" width="16" height="12" viewBox="0 0 16 12" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path
                                    d="M5.288 8.775L13.763 0.3C13.963 0.1 14.2005 0 14.4755 0C14.7505 0 14.988 0.1 15.188 0.3C15.388 0.5 15.488 0.7375 15.488 1.0125C15.488 1.2875 15.388 1.525 15.188 1.725L5.988 10.925C5.788 11.125 5.55467 11.225 5.288 11.225C5.02133 11.225 4.788 11.125 4.588 10.925L0.288 6.625C0.088 6.425 -0.00783333 6.1875 0.0005 5.9125C0.00883333 5.6375 0.113 5.4 0.313 5.2C0.513 5 0.7505 4.9 1.0255 4.9C1.3005 4.9 1.538 5 1.738 5.2L5.288 8.775Z"
                                    fill="#2a3647" />
                            </svg>
                        </button>
                    </div>
                </section>
            </form>
        </div>
    </dialog>
</body>

</html>
