<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>
    <link
      rel="icon"
      href="../assets/icons/join-logo-white.svg"
      type="image/svg+xml"
    />
    <link rel="stylesheet" href="../styles/variables.css" />
    <link rel="stylesheet" href="../styles/standard.css" />
    <link rel="stylesheet" href="../styles/fonts.css" />
    <link rel="stylesheet" href="../styles/assets.css" />
    <link rel="stylesheet" href="../styles/index.css" />
  </head>
  <body>
    <header>
      <img
        class="join-logo-blue"
        src="../assets/icons/join-logo-blue.svg"
        alt="logo"
        class="logo"
      />
    </header>

    <main>
      <form class="form-container signup-container">
        <div class="form-headline-container form-headline-container-signup">
          <a href="../index.html">
            <button class="blue-arrow-left-btn">
              <img src="../assets/icons/blue-arrow-left.svg" alt="" />
            </button>
          </a>
          <div class="headline-wrapper">
            <h1>Sign up</h1>
            <div class="h1-underline"></div>
          </div>
        </div>
        <section class="input-fields input-fields-signup">
          <input
            class="form-input form-input-name"
            placeholder="Name"
            type="text"
            name=""
            id=""
          />
          <input
            placeholder="Email"
            class="form-input form-input-email"
            type="email"
            name=""
            id=""
          />
          <input
            placeholder="Password"
            class="form-input form-input-password"
            type="password"
            name=""
            id=""
          />
          <input
            placeholder="Confirm Password"
            class="form-input form-input-confirm-password"
            type="password"
            name=""
            id=""
          />
        </section>

        <div class="accept-privacy-container">
          <div class="checkbox-container">
            <input class="accept-checkbox" type="checkbox" name="" id="" />
          </div>
          <p>
            I accept the
            <a href="../html/privacy-policy.html">Privacy Policy</a>
          </p>
        </div>

        <button class="button button-login button-blue">Sign Up</button>
      </form>
    </main>

    <footer>
      <nav>
        <a href="../html/privacy-policy.html">Privacy Policy</a
        ><a href="../html/legal-notice.html">Legal Notice</a>
      </nav>
    </footer>
  </body>
</html>
