<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>
    <link
      rel="icon"
      href="../assets/icons/join-logo-white.svg"
      type="image/svg+xml"
    />
    <link rel="stylesheet" href="../styles/variables.css" />
    <link rel="stylesheet" href="../styles/standard.css" />
    <link rel="stylesheet" href="../styles/fonts.css" />
    <link rel="stylesheet" href="../styles/assets.css" />
    <link rel="stylesheet" href="../styles/index.css" />
  </head>
  <body>
    <header>
      <img
        class="join-logo-blue"
        src="../assets/icons/join-logo-blue.svg"
        alt="logo"
        class="logo"
      />
    </header>

    <main>
      <form class="form-container signup-container">
        <div class="form-headline-container">
          <button class="blue-arrow-left-btn">
            <img src="./assets/icons/blue-arrow-left.svg" alt="" />
          </button>
          <h1 class="h1-login">Sign up</h1>
          <div class="h1-underline"></div>
        </div>
        <input
          class="input-login input-login-name"
          placeholder="Name"
          type="text"
          name=""
          id=""
        />
        <input
          placeholder="Email"
          class="input-login input-login-email"
          type="email"
          name=""
          id=""
        />
        <input
          placeholder="Password"
          class="input-login input-login-password"
          type="password"
          name=""
          id=""
        />
        <input
          placeholder="Confirm Password"
          class="input-login input-login-confirm-password"
          type="password"
          name=""
          id=""
        />

        <div class="accept-privacy-container">
          <input class="accept-checkbox" type="checkbox" name="" id="" />
          <p>I accept the <a href="">Privacy Policy</a></p>
        </div>

        <button class="mg-top- button button-login button-blue">Sign Up</button>
      </form>
    </main>

    <footer>
      <nav><a href="">Privacy Policy</a><a href="">Legal Notice</a></nav>
    </footer>
  </body>
</html>
