    <header class="header">
      <h2 class="header-title">Kanban Project Management Tool</h2>

      <div class="header-actions">
        <a href="help.html" class="nav-link">
          <img class="nav-icon" src="/assets/icons/help-logo.svg" alt="" />
        </a>

        <div class="header-avatar">SM</div>
      </div>
    </header>

    <main class="main-content">
      <div class="content-wrapper">
        <h1>Add Task</h1>
        <form onsubmit="addTask()" id="task-form" class="task-form" novalidate>
          <div class="add-task-inner-wrapper">
            <div class="add-task-container">
              <label for="task-title">Title<span class="red">*</span></label>
              <div class="required">
                <input
                  type="text"
                  id="task-title"
                  placeholder="Enter a title"
                  required
                />
              </div>
              <label for="task-description">Description</label>
              <textarea
                id="task-description"
                placeholder="Enter a description"
              ></textarea>
              <label for="task-due-date"
                >Due Date<span class="red">*</span></label
              >
              <div class="required">
                <input
                  class="task-date-input"
                  lang="en-GB"
                  type="date"
                  id="task-due-date"
                  placeholder="dd/mm/yyyy"
                  required
                />
              </div>
            </div>

            <div class="seperation-line"></div>

            <div class="add-task-container">
              <label for="task-priority">Priority</label>
              <div id="task-priority" class="add-task-prio-btns-container">

                  onclick="setPriority('urgent')"
                  id="urgent-prio-btn"
                  class="prio-btn"

              </div>

              <section class="select-contacts-section">
                <label for="contacts">Assigned to</label>
                <div
                  class="custom-select custom-select--contacts"
                  id="contacts-dropdown"
                  tabindex="0"
                >
                  <div
                    onclick="toggleCustomSelectDropdown('contacts')"
                    class="custom-select--trigger custom-select-input trigger-input-container"
                    id="custom-select-trigger-contacts "
                    tabindex="0"
                  >
                    <input
                      oninput="filterContacts1()"
                      onclick="checkStopPropagation(event)"
                      class="search-contact-input"
                      id="search-contact-input"
                      type="text"
                      placeholder="Select contacts to assign"
                    />
                    <div class="custom-select--trigger--img-container">
                      <img
                        id="arrow-dropdown--contacts"
                        src="../assets/icons/arrow-drop-down.svg"
                        alt=""
                      />
                    </div>
                  </div>

                  <div
                    id="select-options--contacts"
                    class="custom-select-options custom-select-options--contacts display-none"
                  ></div>
                </div>

                <div
                  class="selected-contacts"
                  id="selected-contacts-container"
                ></div>
              </section>

              <label for="task-category"
                >Category<span class="red">*</span></label
              >
              <div
                class="custom-select custom-select--categories"
                id="categories-dropdown"
              >
                <div
                  onclick="toggleCustomSelectDropdown('category')"
                  class="custom-select--trigger custom-select-input"
                  id="custom-select-trigger-category"
                  tabindex="0"
                >
                  <span id="selected-category"></span>
                  <div class="custom-select--trigger--img-container">
                    <img
                      id="arrow-dropdown--category"
                      src="../assets/icons/arrow-drop-down.svg"
                      alt=""
                    />
                  </div>
                </div>
                <div
                  id="select-options--category"
                  class="custom-select-options display-none"
                ></div>
              </div>

              <label for="subtask">Subtasks</label>
              <div class="subtask-container">
                <div
                  tabindex="0"
                  class="trigger-input-container custom-select-input"
                >
                  <input
                    class="subtask-input"
                    type="text"
                    id="subtask-input"
                    placeholder="Add new subtask"
                  />
                  <div class="subtask-btns-container">
                    <button
                      class="subtask-btn-left"
                      type="button"
                      id="delete-subtask-btn"
                      onclick="clearSubtaskInput()"
                    >
                      <svg
                        width="13"
                        height="13"
                        viewBox="0 0 13 13"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                      >
                        <path
                          d="M6.243 6.243L11.486 11.486M1 11.486L6.243 6.243L1 11.486ZM11.486 1L6.242 6.243L11.486 1ZM6.242 6.243L1 1L6.242 6.243Z"
                          stroke="#2A3647"
                          stroke-width="2"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                        />
                      </svg>
                    </button>
                    <div class="subtask-btns-seperation-line"></div>

                    <button
                      class="subtask-btn-right"
                      type="button"
                      id="save-subtask-btn"
                      onclick="addSubtask()"
                    >
                      <svg
                        width="14"
                        height="14"
                        viewBox="0 0 14 14"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                      >
                        <path
                          d="M1 8.5L5 12.5L13 1"
                          stroke="#2A3647"
                          stroke-width="2"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                        />
                      </svg>
                    </button>
                  </div>
                </div>

          <p class="p-required">
            <span class="red">*</span>this field is required
          </p>

          <div class="add-task-bottom-btns-container">
            <div class="bottom-btns-wrapper">
              <button
                onclick="clearTask()"
                type="reset"
                id="clear-task-btn"
                class="button add-task-bottom-btn button-white"
              >
                Clear
                <svg
                  id="clear-task-btn-svg"
                  width="13"
                  height="13"
                  viewBox="0 0 13 13"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M6.243 6.243L11.486 11.486M1 11.486L6.243 6.243L1 11.486ZM11.486 1L6.242 6.243L11.486 1ZM6.242 6.243L1 1L6.242 6.243Z"

                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </button>
              <button
                type="submit"
                id="create-task-btn"
                class="button add-task-bottom-btn button-blue"
              >
                Create Task
