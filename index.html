<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join</title>
    <link
      rel="icon"
      href="../assets/icons/join-logo-white.svg"
      type="image/svg+xml"
    />
    <link rel="stylesheet" href="./styles/variables.css" />
    <link rel="stylesheet" href="./styles/standard.css" />
    <link rel="stylesheet" href="./styles/fonts.css" />
    <link rel="stylesheet" href="./styles/assets.css" />
    <link rel="stylesheet" href="./styles/index.css" />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <img
        class="join-logo-blue"
        src="./assets/icons/join-logo-blue.svg"
        alt="logo"
        class="logo"
      />
      <nav>
        <a class="not-a-user-link" href="#">Not a join user?</a>
        <button class="button button-blue button-signup-small">
          <a href="./html/signup.html">Sign up</a>
        </button>
      </nav>
    </header>
    <main>
      <form class="form-container login-container">
        <div class="form-headline-container">
          <h1 class="h1-login">Log in</h1>
          <div class="h1-underline"></div>
        </div>
        <input
          placeholder="Email"
          class="form-login input-login-email"
          type="email"
          name=""
          id=""
        />
        <input
          placeholder="Password"
          class="form-login input-login-password"
          type="password"
          name=""
          id=""
        />
        <section class="form-btn-section">
          <button type="submit" class="button button-login button-blue">
            Log in</button
          ><button type="button" class="button button-login button-white">
            Guest Log in
          </button>
        </section>
      </form>
    </main>
    <footer>
      <nav>
        <a href="">Privacy Policy</a
        ><a href="/html/legal notice.html">Legal Notice</a>
      </nav>
    </footer>
  </body>
</html>
