<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Board</title>
    <link rel="stylesheet" type="text/css" href="./board.css">
    <link rel="stylesheet" type="text/css" href="./style.css">
    <link rel="stylesheet" type="text/css" href="./styles/standard.css">
    <link rel="stylesheet" type="text/css" href="./styles/variables.css">
</head>

<body>
    <main class="mainContent">
        <section class="boardHeader">
            <h1 class="headText">Board</h1>
            <div class="searchAndAddSection">
                <form class="form" action="onSubmit">
                    <input class="inputField" required type="text" placeholder="Find Task">
                    <hr>
                    <button class="searchBtn" type="submit">
                        <img src="./assets/icons/search.svg" alt="search icon">
                    </button>
                </form>
                <button class="addBtn">
                    <span>Add task</span>
                    <img src="./assets/icons/white_plus_button.svg" alt="white plus icon">
                </button>
            </div>
        </section>
        <section>
            <div class="taskTitles">
                <div class="taskLanes">
                    <div class="taskTitle">
                        <h2>To do</h2>
                        <img role="button" src="./assets/icons/plus_button.svg" alt="plus button">
                    </div>
                    <div class="cardContainer">
                    </div>
                </div>
                <div class="taskLanes">
                    <div class="taskTitle">
                        <h2>in progress</h2>
                        <img role="button" src="./assets/icons/plus_button.svg" alt="plus button">
                    </div>
                    <div class="cardContainer">
                        <div class="card">
                            <span class="categoryField">User Story</span>
                            <h3 class="cardText">TestCard</h3>
                            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Voluptas, voluptate.</p>
                            0
                        </div>
                    </div>
                </div>
                <div class="taskLanes">
                    <div class="taskTitle">
                        <h2>Await feedback</h2>
                        <img role="button" src="./assets/icons/plus_button.svg" alt="plus button">
                    </div>
                    <div class="cardContainer">
                    </div>
                </div>
                <div class="taskLanes">
                    <div class="taskTitle">
                        <h2>Done</h2>
                        <img role="button" src="./assets/icons/plus_button.svg" alt="plus button">
                    </div>
                    <div class="cardContainer">
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
